
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="form-box">
        <h1>Edit Student</h1>

        <form method="POST">
            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                placeholder="Student Name"
                required
            >

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                placeholder="Email Address"
                required
            >

            <input
                type="text"
                name="major"
                value="{{ student.major }}"
                placeholder="Major"
                required
            >

            <button type="submit">Save Changes</button>
        </form>

        <p><a href="/">Back to Students List</a></p>
    </div>
</div>

</body>
</html>
